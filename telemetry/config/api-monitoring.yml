##############################################################################
# Authentication Configuration Guide
##############################################################################

# No Authentication (Default)
# Use this for internal APIs or APIs that expose metrics publicly
{
  "targets": ["api.example.com:8080"],
  "labels": {
    "job": "public-api",
    "metrics_path": "/metrics"
  }
}

# Basic Authentication
# Use when API requires username/password
# Configure Prometheus with basic auth credentials
{
  "targets": ["api.example.com:8080"],
  "labels": {
    "job": "api-basic-auth",
    "metrics_path": "/metrics",
    "auth_type": "basic",
    "auth_username": "prometheus",
    "auth_password": "secure-password"
  }
}

# Bearer Token Authentication
# Use when API requires token-based auth
# Configure Prometheus with bearer token
{
  "targets": ["api.example.com:8080"],
  "labels": {
    "job": "api-bearer-auth",
    "metrics_path": "/metrics",
    "auth_type": "bearer",
    "auth_token": "your-long-bearer-token-here"
  }
}

# TLS/HTTPS Configuration
# For APIs using HTTPS, Prometheus handles TLS automatically
# Set the scheme label to https (optional, usually auto-detected)
{
  "targets": ["api.example.com:443"],
  "labels": {
    "job": "https-api",
    "metrics_path": "/metrics",
    "scheme": "https"
  }
}

##############################################################################
# Best Practices
##############################################################################

# 1. Use descriptive job names
#    Good: user-service-api, payment-gateway
#    Bad: api1, api2

# 2. Always include environment label
#    Helps separate production, staging, and development metrics

# 3. Use consistent metrics_path
#    Stick to /metrics when possible for standard endpoints

# 4. Add team and service labels
#    Helps identify ownership and organization

# 5. Group related targets
#    Multiple instances of the same API go in one file

# 6. Use file names that match the API
#    api-user-service.json, api-payment-gateway.json

# 7. Test metrics endpoints before adding
#    curl http://api.example.com:8080/metrics

# 8. Monitor scrape errors
#    Check Prometheus UI: http://localhost:4102/targets

# 9. Use appropriate scrape intervals
#    Default 15s is good for most cases
#    Consider 30s-60s for less critical APIs

# 10. Document custom metrics
#     Create Grafana dashboards for custom application metrics

##############################################################################
# Troubleshooting
##############################################################################

# Problem: API not showing in Prometheus targets
# Solution:
#   - Check file is in config/prometheus-file-sd/
#   - Verify JSON format is valid
#   - Ensure Prometheus is running
#   - Reload Prometheus: docker kill -s HUP prometheus

# Problem: Scrape errors in Prometheus
# Solution:
#   - Test metrics endpoint: curl http://api.example.com:8080/metrics
#   - Check network connectivity from container: docker exec prometheus ping api.example.com
#   - Verify authentication credentials
#   - Check firewall rules

# Problem: Metrics not appearing in Grafana
# Solution:
#   - Verify Prometheus datasource is configured
#   - Check Prometheus targets are UP
#   - Query metrics in Prometheus UI first
#   - Check Grafana dashboard queries

# Problem: High scrape latency
# Solution:
#   - Check API performance
#   - Increase scrape_interval in prometheus.yml
#   - Add scrape_timeout label
#   - Consider reducing number of metrics exported

