##############################################################################
# API Monitoring Configuration Template
#
# This file serves as a reference for configuring API monitoring targets.
# In production, APIs are added via individual JSON files in the
# prometheus-file-sd/ directory (see examples below).
#
# This template demonstrates the configuration format and available options.
##############################################################################

# This is a TEMPLATE file. Do not modify directly.
# To add new APIs, use the helper script: ./scripts/add-api-monitoring.sh
# Or create JSON files manually in: config/prometheus-file-sd/

##############################################################################
# Configuration Examples
##############################################################################

# Example 1: Simple REST API with no authentication
# File: config/prometheus-file-sd/api-rest-example.json
{
  "targets": ["api.example.com:8080"],
  "labels": {
    "job": "rest-api-example",
    "metrics_path": "/metrics",
    "env": "production"
  }
}

# Example 2: API with Basic Authentication
# File: config/prometheus-file-sd/api-basic-auth.json
{
  "targets": ["api.example.com:8080"],
  "labels": {
    "job": "api-with-auth",
    "metrics_path": "/metrics",
    "env": "production",
    "auth_type": "basic",
    "auth_username": "admin",
    "auth_password": "your-password-here"
  }
}

# Example 3: API with Bearer Token
# File: config/prometheus-file-sd/api-bearer-auth.json
{
  "targets": ["api.example.com:8080"],
  "labels": {
    "job": "api-with-bearer",
    "metrics_path": "/metrics",
    "env": "production",
    "auth_type": "bearer",
    "auth_token": "your-bearer-token-here"
  }
}

# Example 4: Multiple API Instances (Load Balanced)
# File: config/prometheus-file-sd/api-load-balanced.json
{
  "targets": [
    "api1.example.com:8080",
    "api2.example.com:8080",
    "api3.example.com:8080"
  ],
  "labels": {
    "job": "load-balanced-api",
    "metrics_path": "/metrics",
    "env": "production"
  }
}

# Example 5: API with Custom Labels
# File: config/prometheus-file-sd/api-custom-labels.json
{
  "targets": ["api.example.com:8080"],
  "labels": {
    "job": "labeled-api",
    "metrics_path": "/metrics",
    "env": "production",
    "team": "platform",
    "service": "user-service",
    "region": "us-east-1",
    "tier": "backend"
  }
}

# Example 6: API with Custom Metrics Path
# File: config/prometheus-file-sd/api-custom-path.json
{
  "targets": ["api.example.com:8080"],
  "labels": {
    "job": "api-custom-path",
    "metrics_path": "/api/v1/metrics",
    "env": "production"
  }
}

# Example 7: Internal API (Docker Network)
# File: config/prometheus-file-sd/api-internal.json
{
  "targets": ["api-service:8080"],
  "labels": {
    "job": "internal-api",
    "metrics_path": "/metrics",
    "env": "production"
  }
}

# Example 8: API with Different Port
# File: config/prometheus-file-sd/api-different-port.json
{
  "targets": ["api.example.com:9000"],
  "labels": {
    "job": "api-port-9000",
    "metrics_path": "/metrics",
    "env": "production"
  }
}

##############################################################################
# Available Configuration Options
##############################################################################

# Required Fields:
#   - targets: Array of host:port strings
#   - labels.job: Name for the monitoring job
#
# Optional Labels:
#   - metrics_path: Path to metrics endpoint (default: /metrics)
#   - env: Environment (e.g., production, staging, development)
#   - auth_type: Authentication method (none, basic, bearer)
#   - auth_username: Username for basic auth
#   - auth_password: Password for basic auth
#   - auth_token: Token for bearer auth
#   - team: Team responsible for the API
#   - service: Service name
#   - region: Geographic region
#   - tier: Application tier (frontend, backend, database)
#   - instance: Instance identifier
#   - datacenter: Datacenter name
#
# Scrape Configuration (via relabeling in prometheus.yml):
#   - scrape_interval: How often to scrape (default: 15s)
#   - scrape_timeout: Scrape timeout (default: 10s)
#   - scheme: http or https (default: http)

