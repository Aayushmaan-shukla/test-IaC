# ============================================
# Dashboard Variable Configuration
# ============================================
# Dashboards should use the following variables for consistency:
#
# - $datasource: Prometheus datasource (default)
# - $loki_datasource: Loki datasource
# - $tempo_datasource: Tempo datasource
# - $cluster: Cluster name
# - $environment: Environment (production/staging/development)
# - $instance: Instance/hostname
# - $job: Job name
#
# Example variable in dashboard JSON:
# {
#   "name": "datasource",
#   "type": "datasource",
#   "query": "prometheus",
#   "refresh": 1
# }

# ============================================
# Dashboard Best Practices
# ============================================
#
# 1. Folder Organization:
#    - Group dashboards by function (system, logs, databases, etc.)
#    - Use clear, descriptive folder names
#    - Avoid deep folder structures
#
# 2. Dashboard Naming:
#    - Use descriptive names: "System Overview", "MongoDB Performance"
#    - Include system type if applicable: "Linux System Overview"
#    - Avoid generic names like "Dashboard 1"
#
# 3. Dashboard Annotations:
#    - Include description of what the dashboard monitors
#    - Document required datasources and variables
#    - List the author and date
#
# 4. Panel Organization:
#    - Group related panels together
#    - Use row titles for organization
#    - Keep dashboard scroll-free if possible
#    - Use collapsed rows for less-critical panels
#
# 5. Query Optimization:
#    - Use $__interval for proper time series resolution
#    - Limit time ranges with $__timeFilter
#   - Use query variables to reduce panel duplication
#
# 6. Visualization:
#    - Choose appropriate chart types for data
#    - Use color coding for status panels
#    - Add thresholds for visual alerts
#    - Include tooltips with context
#
# 7. Dashboard Variables:
#   - Make dashboards reusable with variables
#   - Use multi-value variables where appropriate
#   - Include "All" option for variables
#   - Use regex for variable filtering
#
# 8. Alerts:
#   - Configure alerts for critical metrics
#   - Use appropriate thresholds
#   - Include notification channels
#   - Document alert conditions

