# ============================================
# Dashboard Updates
# ============================================
# Dashboards are automatically reloaded every 10 seconds by default.
# To manually trigger a reload:
#   curl -X POST http://grafana:3000/api/admin/provisioning/dashboards/reload
#
# To reload a specific provider:
#   curl -X POST http://grafana:3000/api/admin/provisioning/dashboards/reload/ProviderName

# ============================================
# Dashboard Backup
# ============================================
# Backup all dashboards regularly:
#   grafana-cli admin export-dashboards /path/to/backup
#
# Or use the API:
#   curl http://admin:password@grafana:3000/api/search?query= \
#     | jq -r '.[] | .uri' | \
#     xargs -I {} curl http://admin:password@grafana:3000/api/dashboards/uid/{}
