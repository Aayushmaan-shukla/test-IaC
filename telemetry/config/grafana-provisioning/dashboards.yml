# ============================================
# Dashboard Import Configuration
# ============================================
# Note: To automatically import community dashboards, create JSON files
# in the respective directories defined above. Each file should contain
# a valid Grafana dashboard JSON.

# Example directory structure:
# /etc/grafana/provisioning/dashboards/
# ├── system/
# │   ├── node-exporter-full.json
# │   ├── prometheus-stats.json
# │   └── docker-containers.json
# ├── logs/
# │   ├── loki-logs.json
# │   ├── auth-security.json
# │   └── application-logs.json
# ├── databases/
# │   ├── mongodb.json
# │   └── postgresql.json
# ├── apis/
# │   ├── rest-api-monitoring.json
# │   └── grpc-api-monitoring.json
# ├── security/
# │   ├── ssh-security.json
# │   ├── audit-logs.json
# │   └── intrusion-detection.json
# ├── community/
# │   ├── 1860-node-exporter-full.json
# │   ├── 13131-host-overview.json
# │   └── 11529-loki-dashboard.json
# ├── alerts/
# │   ├── alertmanager-overview.json
# │   └── notification-channels.json
# ├── tracing/
# │   ├── tempo-overview.json
# │   └── service-dependencies.json
# └── infrastructure/
#     ├── cluster-overview.json
#     └── resource-utilization.json

