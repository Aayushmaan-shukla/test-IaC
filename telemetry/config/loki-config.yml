# Loki Configuration
# Production-ready log aggregation system

auth_enabled: false

# Server configuration
server:
  http_listen_port: ${LOKI_HTTP_PORT:-3100}
  grpc_listen_port: ${LOKI_GRPC_PORT:-9096}

  # HTTP server configuration
  http_server_read_timeout: ${HTTP_READ_TIMEOUT:-30s}
  http_server_write_timeout: ${HTTP_WRITE_TIMEOUT:-30s}
  http_server_idle_timeout: ${HTTP_IDLE_TIMEOUT:-2m}

  # gRPC server configuration
  grpc_server_max_recv_msg_size: ${GRPC_MAX_RECV_MSG_SIZE:-16777216}
  grpc_server_max_send_msg_size: ${GRPC_MAX_SEND_MSG_SIZE:-16777216}
  grpc_server_max_concurrent_streams: ${GRPC_MAX_STREAMS:-1000}

# Memberlist configuration for clustering
memberlist:
  join_members:
    - ${LOKI_MEMBERLIST_HOST:-loki}:${LOKI_MEMBERLIST_PORT:-7946}
  dead_node_reclaim_interval: ${MEMBERLIST_DEAD_INTERVAL:-1m}
  left_node_timeout: ${MEMBERLIST_LEFT_TIMEOUT:-5m}
  push_pull_interval: ${MEMBERLIST_PUSH_PULL_INTERVAL:-15s}

# Common configuration
common:
  path_prefix: ${LOKI_PATH_PREFIX:-/loki}
  storage:
    filesystem:
      chunks_directory: ${LOKI_STORAGE_PATH:-/loki}/chunks
      rules_directory: ${LOKI_STORAGE_PATH:-/loki}/rules

  replication_factor: ${REPLICATION_FACTOR:-1}
  ring:
    kvstore:
      store: inmemory

# Storage configuration
storage_config:
  boltdb_shipper:
    active_index_directory: ${LOKI_STORAGE_PATH:-/loki}/index
    cache_location: ${LOKI_STORAGE_PATH:-/loki}/cache
    shared_store: filesystem

  filesystem:
    directory: ${LOKI_STORAGE_PATH:-/loki}/chunks

# Limits configuration
limits_config:
  enforce_metric_name: ${ENFORCE_METRIC_NAME:-false}
  reject_old_samples: ${REJECT_OLD_SAMPLES:-true}
  reject_old_samples_max_age: ${REJECT_OLD_SAMPLES_MAX_AGE:-168h}

  # Stream limits
  max_streams_per_user: ${MAX_STREAMS_PER_USER:-0}  # 0 = unlimited
  max_global_streams_per_user: ${MAX_GLOBAL_STREAMS_PER_USER:-0}

  # Rate limits
  ingestion_rate_mb: ${INGESTION_RATE_MB:-16}
  ingestion_burst_size_mb: ${INGESTION_BURST_MB:-32}
  per_stream_rate_limit: ${PER_STREAM_RATE_LIMIT:-10MB}
  per_stream_rate_limit_burst: ${PER_STREAM_RATE_LIMIT_BURST:-20MB}

  # Series limits
  max_series_per_metric: ${MAX_SERIES_PER_METRIC:-0}
  max_series_per_user: ${MAX_SERIES_PER_USER:-0}

  # Sample limits
  max_entries_limit_per_query: ${MAX_ENTRIES_LIMIT:-5000}
  max_query_series: ${MAX_QUERY_SERIES:-500}
  max_streams_matchers_per_query: ${MAX_STREAM_MATCHERS:-1000}

  # Query limits
  split_queries_by_interval: ${SPLIT_QUERIES_INTERVAL:-30m}
  max_cache_freshness_per_query: ${MAX_CACHE_FRESHNESS:-10m}
  max_query_parallelism: ${MAX_QUERY_PARALLELISM:-32}
  max_concurrent_tail_requests: ${MAX_CONCURRENT_TAIL:-128}
  max_query_length: ${MAX_QUERY_LENGTH:-721h}

  # Cardinality limits
  cardinality_limit: ${CARDINALITY_LIMIT:-100000}

  # Retention
  retention_period: ${RETENTION_PERIOD:-744h}  # 31 days

# Chunk store configuration
chunk_store_config:
  max_look_back_period: ${MAX_LOOK_BACK_PERIOD:-168h}  # 7 days

# Schema configuration
schema_config:
  configs:
    - from: ${SCHEMA_FROM:-2020-10-24}
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Compactor configuration
compactor:
  working_directory: ${LOKI_STORAGE_PATH:-/loki}/compactor
  shared_store: filesystem

  # Compaction intervals
  compaction_interval: ${COMPACTION_INTERVAL:-10m}
  retention_enabled: ${RETENTION_ENABLED:-true}
  delete_request_cancel_period: ${DELETE_CANCEL_PERIOD:-24h}

  # Limits
  max_compaction_parallelism: ${MAX_COMPACTION_PARALLELISM:-1}
  retention_delete_delay: ${RETENTION_DELETE_DELAY:-2h}
  retention_delete_worker_count: ${RETENTION_DELETE_WORKERS:-150}

# Ingester configuration
ingester:
  lifecycler:
    address: ${POD_IP:-127.0.0.1}
    ring:
      kvstore:
        store: inmemory
      replication_factor: ${REPLICATION_FACTOR:-1}

  # Chunk management
  chunk_idle_period: ${CHUNK_IDLE_PERIOD:-30m}
  chunk_block_size: ${CHUNK_BLOCK_SIZE:-262144}
  chunk_target_size: ${CHUNK_TARGET_SIZE:-1536000}
  chunk_encoding: ${CHUNK_ENCODING:-snappy}

  # Flush configuration
  chunk_retain_period: ${CHUNK_RETAIN_PERIOD:-1m}
  max_transfer_retries: ${MAX_TRANSFER_RETRIES:-0}
  sync_period: ${SYNC_PERIOD:-0s}
  sync_min_utilization: ${SYNC_MIN_UTILIZATION:-0.1}

  # WAL configuration
  wal:
    dir: ${LOKI_STORAGE_PATH:-/loki}/wal
    enabled: ${WAL_ENABLED:-true}
    truncate_frequency: ${WAL_TRUNCATE_FREQ:-2h}

  # Lifecycler configuration
  lifecycler:
    ring:
      replication_factor: ${REPLICATION_FACTOR:-1}
      tokens_file_path: ${LOKI_STORAGE_PATH:-/loki}/tokens

# Querier configuration
querier:
  timeout: ${QUERIER_TIMEOUT:-5m}
  query_timeout: ${QUERY_TIMEOUT:-5m}
  max_concurrent_queries: ${MAX_CONCURRENT_QUERIES:-20}

  # Engine configuration
  engine:
    timeout: ${ENGINE_TIMEOUT:-5m}
    max_look_back_period: ${MAX_LOOK_BACK_PERIOD:-168h}

# Frontend configuration
frontend:
  compress_responses: ${COMPRESS_RESPONSES:-true}
  log_queries_longer_than: ${LOG_LONG_QUERIES:-10s}
  max_outstanding_per_tenant: ${MAX_OUTSTANDING:-2048}
  tail_max_stale: ${TAIL_MAX_STALE:-1h}

  # Query scheduler
  scheduler_address: ${FRONTEND_SCHEDULER_ADDR:-loki:9095}
  scheduler_worker_address: ${FRONTEND_WORKER_ADDR:-0.0.0.0:9095}

  # Worker configuration
  worker:
    parallelism: ${WORKER_PARALLELISM:-8}
    match_max_concurrent: ${MATCH_MAX_CONCURRENT:-8}
    dns_lookup_duration: ${DNS_LOOKUP_DURATION:-3s}

# Table manager configuration
table_manager:
  retention_deletes_enabled: ${RETENTION_DELETES:-true}
  retention_period: ${RETENTION_PERIOD:-744h}

# Ruler configuration (for alerting)
ruler:
  storage:
    type: local
    local:
      directory: ${LOKI_STORAGE_PATH:-/loki}/rules

  # Alert evaluation
  enable_alertmanager_v2: ${ENABLE_ALERTMANAGER_V2:-true}
  enable_api: ${RULER_ENABLE_API:-true}
  ring:
    kvstore:
      store: inmemory

  # Rule paths
  rule_path: ${LOKI_STORAGE_PATH:-/loki}/rules

  # Evaluation configuration
  evaluation_interval: ${EVALUATION_INTERVAL:-1m}
  evaluation_delay: ${EVALUATION_DELAY:-0s}

  # Remote write
  remote_write:
    enabled: ${REMOTE_WRITE_ENABLED:-false}
    client:
      url: ${REMOTE_WRITE_URL:-}
      batch_wait: ${REMOTE_WRITE_BATCH_WAIT:-1s}
      batch_size: ${REMOTE_WRITE_BATCH_SIZE:-102400}

# Target configuration for distributed tracing
tracing:
  enabled: ${TRACING_ENABLED:-false}
  otlp:
    protocols:
      grpc:
        enabled: ${TRACING_OTLP_GRPC_ENABLED:-false}
        endpoint: ${TRACING_OTLP_GRPC_ENDPOINT:-localhost:4317}
      http:
        enabled: ${TRACING_OTLP_HTTP_ENABLED:-false}
        endpoint: ${TRACING_OTLP_HTTP_ENDPOINT:-http://localhost:4318}

# Query range configuration
query_range:
  cache_results: ${CACHE_RESULTS:-true}
  split_queries_by_interval: ${SPLIT_QUERIES_INTERVAL:-30m}
  max_retries: ${MAX_RETRIES:-5}
  parallelise_shardable_queries: ${PARALLELISE_SHARDABLE:-true}

  # Cache configuration
  results_cache:
    cache:
      embedded_cache:
        enabled: ${EMBEDDED_CACHE_ENABLED:-true}
        max_size_mb: ${EMBEDDED_CACHE_SIZE:-100}
        ttl: ${EMBEDDED_CACHE_TTL:-24h}

# Analytics configuration (optional)
analytics:
  reporting_enabled: ${ANALYTICS_ENABLED:-false}
